
<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #050407; color: white; display: flex; gap: 20px; padding: 40px; font-family: sans-serif; }
  .box { width: 340px; height: 340px; border-radius: 14px; overflow: hidden; background: #0b0a10; position: relative; border: 1px solid rgba(255,255,255,0.1); }
  .box img { width: 100%; height: 100%; }
  .cover { object-fit: cover; }
  .contain { object-fit: contain; background: #fdfaf3; }
  .centered { object-fit: cover; object-position: center; }
  .padded { object-fit: contain; padding: 24px; background: #fdfaf3; }
</style>
</head>
<body>
  <div>
    <h3>1.jpg (current - wide panorama)</h3>
    <div class="box"><img class="cover" src="/projects/raj-pani-puri/optimized/1.jpg"></div>
  </div>
  <div>
    <h3>2.jpg (object-fit: cover)</h3>
    <div class="box"><img class="cover" src="/projects/raj-pani-puri/optimized/2.jpg"></div>
  </div>
  <div>
    <h3>Only Logo (raw)</h3>
    <div class="box"><img class="cover" src="/projects/raj-pani-puri/raw/Only%20Logo-Pani%20Puri.jpg"></div>
  </div>
</body>
</html>
